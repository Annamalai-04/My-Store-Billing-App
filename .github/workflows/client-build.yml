name: Build Client and Upload to S3

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/client-build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-client:
    runs-on: windows-latest

    env:
      AWS_REGION: us-east-1
      S3_BUCKET: my-scroll-videos-2026
      S3_PREFIX: exe

    steps:

      # --------------------------------------------------
      # 1. Download GitHub repository
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Create version automatically
      # Example:
      # First workflow run  -> 1.0.1
      # Second workflow run -> 1.0.2
      # --------------------------------------------------
      - name: Set application version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $versionFile = "client/app/utils/version.py"

          if (-not (Test-Path $versionFile)) {
              throw "Version file not found: $versionFile"
          }

          $content = Get-Content $versionFile -Raw

          $newContent = [regex]::Replace(
              $content,
              'APP_VERSION\s*=\s*["''][^"'']*["'']',
              "APP_VERSION = `"$version`""
          )

          if ($newContent -eq $content) {
              throw "APP_VERSION was not found in $versionFile"
          }

          Set-Content `
              -Path $versionFile `
              -Value $newContent `
              -Encoding UTF8

          Write-Host "Building MyStoreApp version $version"

      # --------------------------------------------------
      # 3. Install Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # --------------------------------------------------
      # 4. Install Python dependencies
      # --------------------------------------------------
      - name: Install client dependencies
        shell: pwsh
        working-directory: client
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
              pip install -r requirements.txt
          }
          else {
              pip install PySide6 requests opencv-python zxing-cpp
          }

          pip install pyinstaller

      # --------------------------------------------------
      # 5. Build MyStoreApp.exe
      # --------------------------------------------------
      - name: Build MyStoreApp.exe
        shell: pwsh
        working-directory: client
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --noconfirm `
            --clean `
            --name MyStoreApp `
            app/main.py

      # --------------------------------------------------
      # 6. Build updater EXE
      # --------------------------------------------------
      - name: Build MyStoreAppUpdater.exe
        shell: pwsh
        working-directory: client
        run: |
          python -m PyInstaller `
            --onefile `
            --noconfirm `
            --clean `
            --name MyStoreAppUpdater `
            updater/MyStoreAppUpdater.py

      # --------------------------------------------------
      # 7. Verify EXE files
      # --------------------------------------------------
      - name: Verify build files
        shell: pwsh
        working-directory: client
        run: |
          if (-not (Test-Path "dist/MyStoreApp.exe")) {
              throw "MyStoreApp.exe was not created."
          }

          if (-not (Test-Path "dist/MyStoreAppUpdater.exe")) {
              throw "MyStoreAppUpdater.exe was not created."
          }

          Write-Host "MyStoreApp.exe created successfully."
          Get-Item "dist/MyStoreApp.exe"

          Write-Host "MyStoreAppUpdater.exe created successfully."
          Get-Item "dist/MyStoreAppUpdater.exe"

      # --------------------------------------------------
      # 8. Create version.json
      # --------------------------------------------------
      - name: Create version.json
        shell: pwsh
        working-directory: client
        run: |
          $version = "1.0.${{ github.run_number }}"

          $versionJson = @{
              version = $version
              download_url = "https://my-scroll-videos-2026.s3.us-east-1.amazonaws.com/exe/MyStoreApp.exe"
              updater_url = "https://my-scroll-videos-2026.s3.us-east-1.amazonaws.com/exe/MyStoreAppUpdater.exe"
          } | ConvertTo-Json

          $versionJson | Set-Content `
              -Path "version.json" `
              -Encoding UTF8

          Write-Host $versionJson

      # --------------------------------------------------
      # 9. Connect GitHub Actions to AWS
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 10. Upload files to S3
      # --------------------------------------------------
      - name: Upload client files to S3
        shell: pwsh
        working-directory: client
        run: |

          aws s3 cp `
            "dist/MyStoreApp.exe" `
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/MyStoreApp.exe"

          aws s3 cp `
            "dist/MyStoreAppUpdater.exe" `
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/MyStoreAppUpdater.exe"

          aws s3 cp `
            "version.json" `
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/version.json"

      # --------------------------------------------------
      # 11. Display result
      # --------------------------------------------------
      - name: Deployment completed
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "MyStoreApp client deployment completed."
          Write-Host "Version: 1.0.${{ github.run_number }}"
          Write-Host "=========================================="