name: Build Backend and Deploy to K3s

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: annamalaikumar/mystoreapp-backend
      IMAGE_TAG: ${{ github.sha }}

    steps:

      # --------------------------------------------------
      # 1. Download repository
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Install Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # --------------------------------------------------
      # 3. Build Spring Boot
      # --------------------------------------------------
      - name: Build Spring Boot application
        working-directory: server/billing_server
        shell: bash
        run: |
          chmod +x mvnw

          ./mvnw clean package -DskipTests

      # --------------------------------------------------
      # 4. Check JAR
      # --------------------------------------------------
      - name: Verify JAR
        working-directory: server/billing_server
        shell: bash
        run: |
          ls -lh target/*.jar

      # --------------------------------------------------
      # 5. Setup Docker Buildx
      # --------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 6. Login to Docker Hub
      # --------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # 7. Build and push Docker image
      # --------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: server/billing_server
          file: server/billing_server/Dockerfile

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

      # --------------------------------------------------
      # 8. SSH into EC2
      # --------------------------------------------------
      - name: Deploy image to EC2 K3s
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          script: |

            set -e

            IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

            echo "=========================================="
            echo "Deploying image:"
            echo "$IMAGE"
            echo "=========================================="

            # Update the running deployment
            sudo k3s kubectl set image deployment/mystoreapp-backend \
              mystoreapp-backend="$IMAGE"

            # Wait until the new pod is ready
            sudo k3s kubectl rollout status \
              deployment/mystoreapp-backend \
              --timeout=180s

            echo "=========================================="
            echo "Deployment successful."
            echo "=========================================="

            # Show deployment
            sudo k3s kubectl get deployment mystoreapp-backend

            # Show pods
            sudo k3s kubectl get pods \
              -l app=mystoreapp-backend