name: MyStoreApp CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


# ============================================================
# CLIENT
# Python / PySide6
# Build EXE → Upload to S3
# ============================================================

jobs:

  build-client:

    runs-on: windows-latest

    env:
      AWS_REGION: us-east-1
      S3_BUCKET: my-scroll-videos-2026
      S3_PREFIX: exe

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v5


      # ------------------------------------------------------
      # 2. Set application version
      # ------------------------------------------------------
      - name: Set application version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $versionFile = "client/app/utils/version.py"

          if (-not (Test-Path $versionFile)) {
              throw "Version file not found: $versionFile"
          }

          @"
          APP_VERSION = "$version"
          "@ | Set-Content -Path $versionFile -Encoding UTF8

          Write-Host "Building MyStoreApp version $version"


      # ------------------------------------------------------
      # 3. Install Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"


      # ------------------------------------------------------
      # 4. Install Python dependencies
      # ------------------------------------------------------
      - name: Install client dependencies
        shell: pwsh
        working-directory: client
        run: |

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
              pip install -r requirements.txt
          }
          else {
              pip install PySide6 requests opencv-python zxing-cpp
          }

          pip install pyinstaller


      # ------------------------------------------------------
      # 5. Build MyStoreApp.exe
      # ------------------------------------------------------
      - name: Build MyStoreApp.exe
        shell: pwsh
        working-directory: client
        run: |

          python -m PyInstaller `
            --onefile `
            --windowed `
            --noconfirm `
            --clean `
            --name MyStoreApp `
            app/main.py


      # ------------------------------------------------------
      # 6. Build updater
      # ------------------------------------------------------
      - name: Build MyStoreAppUpdater.exe
        shell: pwsh
        working-directory: client
        run: |

          python -m PyInstaller `
            --onefile `
            --noconfirm `
            --clean `
            --name MyStoreAppUpdater `
            updater/MyStoreAppUpdater.py


      # ------------------------------------------------------
      # 7. Verify EXE
      # ------------------------------------------------------
      - name: Verify client files
        shell: pwsh
        working-directory: client
        run: |

          if (-not (Test-Path "dist/MyStoreApp.exe")) {
              throw "MyStoreApp.exe was not created."
          }

          if (-not (Test-Path "dist/MyStoreAppUpdater.exe")) {
              throw "MyStoreAppUpdater.exe was not created."
          }

          Write-Host "MyStoreApp.exe:"
          Get-Item "dist/MyStoreApp.exe"

          Write-Host "MyStoreAppUpdater.exe:"
          Get-Item "dist/MyStoreAppUpdater.exe"


      # ------------------------------------------------------
      # 8. Create version.json
      # ------------------------------------------------------
      - name: Create version.json
        shell: pwsh
        working-directory: client
        run: |

          $version = "1.0.${{ github.run_number }}"

          $versionJson = @{
              version = $version
              download_url = "https://my-scroll-videos-2026.s3.us-east-1.amazonaws.com/exe/MyStoreApp.exe"
              updater_url = "https://my-scroll-videos-2026.s3.us-east-1.amazonaws.com/exe/MyStoreAppUpdater.exe"
          } | ConvertTo-Json

          $versionJson | Set-Content `
              -Path "version.json" `
              -Encoding UTF8

          Write-Host $versionJson


      # ------------------------------------------------------
      # 9. Configure AWS
      # ------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # 10. Upload EXE + updater + version.json to S3
      # ------------------------------------------------------
      - name: Upload client files to S3
        shell: pwsh
        working-directory: client
        run: |

          aws s3 cp `
            "dist/MyStoreApp.exe" `
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/MyStoreApp.exe"

          aws s3 cp `
            "dist/MyStoreAppUpdater.exe" `
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/MyStoreAppUpdater.exe"

          aws s3 cp `
            "version.json" `
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/version.json"


      # ------------------------------------------------------
      # 11. Client completed
      # ------------------------------------------------------
      - name: Client deployment completed
        shell: pwsh
        run: |

          Write-Host "=========================================="
          Write-Host "CLIENT DEPLOYMENT COMPLETED"
          Write-Host "Version: 1.0.${{ github.run_number }}"
          Write-Host "=========================================="


  # ============================================================
  # BACKEND
  # Spring Boot
  # Maven → Docker → Docker Hub → EC2 K3s
  # ============================================================

  build-backend:

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: annamalaikumar/mystoreapp-backend
      IMAGE_TAG: ${{ github.sha }}

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v5


      # ------------------------------------------------------
      # 2. Java 17
      # ------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ------------------------------------------------------
      # 3. Build Spring Boot
      # ------------------------------------------------------
      - name: Build Spring Boot application
        working-directory: server/billing_server
        shell: bash
        run: |

          chmod +x mvnw

          ./mvnw clean package -DskipTests


      # ------------------------------------------------------
      # 4. Verify JAR
      # ------------------------------------------------------
      - name: Verify JAR
        working-directory: server/billing_server
        shell: bash
        run: |

          ls -lh target/*.jar


      # ------------------------------------------------------
      # 5. Docker Buildx
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # 6. Docker Hub login
      # ------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ------------------------------------------------------
      # 7. Build and push Docker image
      # ------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:

          context: server/billing_server

          file: server/billing_server/Dockerfile

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest


      # ------------------------------------------------------
      # 8. Deploy to EC2 K3s
      # ------------------------------------------------------
      - name: Deploy to EC2 K3s
        uses: appleboy/ssh-action@v1.2.2
        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          script: |

            set -e

            IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

            echo "=========================================="
            echo "DEPLOYING BACKEND"
            echo "IMAGE:"
            echo "$IMAGE"
            echo "=========================================="

            sudo k3s kubectl set image \
              deployment/mystoreapp-backend \
              mystoreapp-backend="$IMAGE"

            echo "Waiting for rollout..."

            sudo k3s kubectl rollout status \
              deployment/mystoreapp-backend \
              --timeout=180s

            echo "=========================================="
            echo "BACKEND DEPLOYMENT COMPLETED"
            echo "=========================================="

            echo "Deployment:"
            sudo k3s kubectl get deployment mystoreapp-backend

            echo "Pods:"
            sudo k3s kubectl get pods \
              -l app=mystoreapp-backend


      # ------------------------------------------------------
      # 9. Backend completed
      # ------------------------------------------------------
      - name: Backend deployment completed
        shell: bash
        run: |

          echo "=========================================="
          echo "BACKEND CI/CD COMPLETED"
          echo "Docker image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"
          echo "=========================================="